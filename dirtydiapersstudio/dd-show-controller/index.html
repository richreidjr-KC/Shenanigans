    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; height: 100dvh; overflow: hidden; }
      body { background: #0d0d0d; color: #f0f0f0; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 2px; }

      .song-card { padding: 14px 16px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; transition: background 150ms; border-left: 3px solid transparent; min-height: 56px; display: flex; flex-direction: column; justify-content: center; }
      .song-card:hover { background: #1e1e21; }
      .song-card.selected { background: #1e1e21; border-left-color: #f5a623; }
      .song-card.is-live { border-left-color: #22c55e; }

      @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .pulse-live { animation: pulse-dot 2s ease-in-out infinite; }

      @keyframes toast-in { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      @keyframes toast-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(110%); opacity: 0; } }
      .toast-enter { animation: toast-in 200ms ease forwards; }
      .toast-exit { animation: toast-out 200ms ease forwards; }

      .tabular-nums { font-variant-numeric: tabular-nums; }

      /* Full-screen view transitions */
      #left-panel-p4r9,
      #right-panel-r9t2 {
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        will-change: transform, opacity;
      }

      /* View states */
      body[data-view="list"] #left-panel-p4r9 {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
        position: relative;
        z-index: 1;
      }
      body[data-view="list"] #right-panel-r9t2 {
        transform: translateX(100%);
        opacity: 0;
        pointer-events: none;
        position: absolute;
        top: 48px;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
      }

      body[data-view="detail"] #left-panel-p4r9 {
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
        position: absolute;
        top: 48px;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
      }
      body[data-view="detail"] #right-panel-r9t2 {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
        position: relative;
        z-index: 1;
      }

      #main-area-m7w1 {
        position: relative;
        overflow: hidden;
      }
    </style>
</head>

    <!-- TOAST CONTAINER -->
    <div data-id="40" id="toast-box-t8g5" class="fixed bottom-5 right-5 flex flex-col-reverse gap-2 pointer-events-none" style="z-index:9999;"></div>

    <!-- FOOTER CREDIT -->
    <div data-id="41" style="display:none;">Made by Copilot</div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // ===== STATE =====
        let SUPABASE_URL = 'https://ejdpcizxmbvxbzipwsfb.supabase.co';
        let SUPABASE_KEY = 'sb_publishable_aTp1MufuuzY9nkHjpqYtCw_c3mkMmN_';
        let supabase = null;
        let songs = [];
        let selectedSong = null;
        let liveSongId = null;
        let realtimeChannel = null;
        let refreshInterval = null;
        let titleCol = null;
        let bpmCol = null;
        let keyCol = null;
        let extraCols = [];

        // ===== ELEMENTS =====
        const clockEl = document.getElementById('header-clock-h1m4');
        const connDot = document.getElementById('conn-dot-d2j6');
        const connLabel = document.getElementById('conn-label-l8q3');
        const songCountEl = document.getElementById('song-count-c4m8');
        const songListEl = document.getElementById('song-list-l6v3');
        const emptyStateEl = document.getElementById('empty-state-e1n7');
        const placeholderEl = document.getElementById('placeholder-ph3k');
        const detailView = document.getElementById('detail-view-d7f1');
        const detailTitle = document.getElementById('detail-title-t9c6');
        const detailMeta = document.getElementById('detail-meta-m2b5');
        const bpmValue = document.getElementById('bpm-value-v3k1');
        const liveDot = document.getElementById('live-dot-d6r2');
        const liveInfo = document.getElementById('live-info-i4e8');
        const setLiveBtn = document.getElementById('set-live-btn-a2f7');
        const toastBox = document.getElementById('toast-box-t8g5');
        const backBtn = document.getElementById('back-btn-bk2');

        // ===== ICONS =====
        if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
            lucide.createIcons();
        }

        // ===== VIEW NAVIGATION =====
        function showListView() {
            document.body.setAttribute('data-view', 'list');
        }

        function showDetailView() {
            document.body.setAttribute('data-view', 'detail');
        }

        backBtn.addEventListener('click', () => {
            showListView();
        });

        // ===== CLOCK (12-hour with AM/PM) =====
        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== TOASTS =====
        function showToast(message, type = 'info') {
            const styles = {
                success: 'background:#166534;border-left:3px solid #22c55e;',
                error: 'background:#7f1d1d;border-left:3px solid #ef4444;',
                info: 'background:#1e1e21;border-left:3px solid #3a3a40;',
            };
            const t = document.createElement('div');
            t.className = 'toast-enter pointer-events-auto';
            t.style.cssText = `padding:12px 16px;border-radius:6px;font-size:13px;color:#f0f0f0;max-width:320px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,0.4);word-break:break-word;${styles[type] || styles.info}`;
            t.textContent = message;
            toastBox.appendChild(t);
            setTimeout(() => {
                t.className = 'toast-exit pointer-events-auto';
                setTimeout(() => t.remove(), 200);
            }, 4000);
        }

        // ===== CONNECTION STATUS =====
        function setConn(state, label) {
            const colors = { green: '#22c55e', amber: '#f5a623', red: '#ef4444' };
            connDot.style.background = colors[state] || colors.amber;
            connDot.style.boxShadow = `0 0 5px ${colors[state] || colors.amber}`;
            connLabel.textContent = label;
        }

        // ===== DETECT COLUMNS =====
        function detectColumns(row) {
            const keys = Object.keys(row);
            titleCol = keys.find(k => /^(title|name|song_name|song_title)$/i.test(k)) || null;
            bpmCol = ['drummer_click_bpm','recording_bpm','bpm','tempo'].find(k => keys.includes(k)) || keys.find(k => /bpm|tempo/i.test(k)) || null;
            keyCol = keys.find(k => /^(key|musical_key|song_key)$/i.test(k)) || null;
            const skip = new Set(['id', titleCol, bpmCol, keyCol, 'setlist_order', 'created_at', 'updated_at'].filter(Boolean));
            extraCols = keys.filter(k => !skip.has(k));
        }

        function getTitle(s) { return titleCol ? (s[titleCol] || 'Untitled') : `Song #${s.id}`; }
        function getBpm(s) { return bpmCol && s[bpmCol] != null ? Number(s[bpmCol]) : null; }
        function getKey(s) { return keyCol ? (s[keyCol] || null) : null; }
        function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

        // ===== RENDER SONGS =====
        function renderSongs() {
            songCountEl.textContent = songs.length;

            if (songs.length === 0) {
                emptyStateEl.style.display = 'flex';
                emptyStateEl.innerHTML = `
                    <span style="font-size:32px;color:#2a2a2e;">♫</span>
                    <p class="text-[14px] mt-3" style="color:#3a3a40;">No songs loaded</p>
                    <p class="text-[12px] mt-2 leading-relaxed" style="color:#3a3a40;">Run <code class="font-mono" style="color:#f5a623;">00_setup.sql</code> in Supabase to enable anon read access on the <code class="font-mono" style="color:#f5a623;">songs</code> table.</p>`;
                return;
            }
            emptyStateEl.style.display = 'none';

            // Remove old cards
            songListEl.querySelectorAll('.song-card').forEach(c => c.remove());

            songs.forEach((song, idx) => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.dataset.songId = song.id;

                if (selectedSong && String(selectedSong.id) === String(song.id)) card.classList.add('selected');
                if (liveSongId && String(liveSongId) === String(song.id)) card.classList.add('is-live');

                const title = getTitle(song);
                const bpm = getBpm(song);
                const key = getKey(song);
                const isLive = liveSongId && String(liveSongId) === String(song.id);

                let html = `<div class="flex items-center gap-3">
                    <span class="font-mono text-[13px] w-6 text-right shrink-0" style="color:#3a3a40;">${String(idx + 1).padStart(2, '0')}</span>
                    <span class="text-[15px] font-medium flex-1 truncate" style="color:#f0f0f0;">${esc(title)}</span>`;
                if (isLive) {
                    html += `<span class="text-[10px] font-bold tracking-[0.08em] px-1.5 py-[1px] rounded" style="background:#22c55e;color:#000;">LIVE</span>`;
                }
                html += `</div>`;

                if (bpm != null || key) {
                    html += `<div class="flex gap-1.5 mt-1.5" style="padding-left:36px;">`;
                    if (bpm != null) html += `<span class="text-[12px] px-1.5 py-[1px] rounded" style="color:#f5a623;background:rgba(245,166,35,0.1);">${bpm} BPM</span>`;
                    if (key) html += `<span class="text-[12px] px-1.5 py-[1px] rounded" style="color:#818cf8;background:rgba(129,140,248,0.1);">${esc(key)}</span>`;
                    html += `</div>`;
                }

                card.innerHTML = html;
                card.addEventListener('click', () => selectSong(song));
                songListEl.appendChild(card);
            });
        }

        // ===== SELECT SONG =====
        function selectSong(song) {
            selectedSong = song;

            // Show detail, hide placeholder
            placeholderEl.style.display = 'none';
            detailView.style.display = 'flex';
            detailView.classList.remove('hidden');

            const title = getTitle(song);
            const bpm = getBpm(song);
            const key = getKey(song);

            detailTitle.textContent = title;

            // Meta
            let metaHtml = '';
            if (key) metaHtml += `<div><span class="text-[10px] font-semibold tracking-[0.12em]" style="color:#6b6b75;">KEY</span> <span class="text-[13px] ml-1" style="color:#a0a0a8;">${esc(key)}</span></div>`;
            extraCols.forEach(col => {
                if (song[col] != null && song[col] !== '') {
                    metaHtml += `<div><span class="text-[10px] font-semibold tracking-[0.12em] uppercase" style="color:#6b6b75;">${esc(col)}</span> <span class="text-[13px] ml-1" style="color:#a0a0a8;">${esc(String(song[col]))}</span></div>`;
                }
            });
            detailMeta.innerHTML = metaHtml;

            // BPM
            if (bpm != null) {
                bpmValue.textContent = bpm;
                bpmValue.style.color = '#f5a623';
            } else {
                bpmValue.textContent = '—';
                bpmValue.style.color = '#2a2a2e';
            }

            // Button state
            updateBtnState();

            // Highlight in list
            songListEl.querySelectorAll('.song-card').forEach(c => {
                c.classList.toggle('selected', String(c.dataset.songId) === String(song.id));
            });

            // Switch to detail view
            showDetailView();
        }

        // ===== BUTTON STATE =====
        function updateBtnState() {
            if (!selectedSong) {
                setLiveBtn.disabled = true;
                setLiveBtn.style.background = '#1e1e21';
                setLiveBtn.style.color = '#3a3a40';
                setLiveBtn.style.border = 'none';
                setLiveBtn.style.cursor = 'not-allowed';
                setLiveBtn.textContent = 'SET LIVE';
                return;
            }
            const isThisLive = liveSongId && String(liveSongId) === String(selectedSong.id);
            if (isThisLive) {
                setLiveBtn.disabled = true;
                setLiveBtn.style.background = 'transparent';
                setLiveBtn.style.color = '#22c55e';
                setLiveBtn.style.border = '2px solid #22c55e';
                setLiveBtn.style.cursor = 'default';
                setLiveBtn.textContent = '● LIVE NOW';
            } else {
                setLiveBtn.disabled = false;
                setLiveBtn.style.background = '#f5a623';
                setLiveBtn.style.color = '#000';
                setLiveBtn.style.border = 'none';
                setLiveBtn.style.cursor = 'pointer';
                setLiveBtn.textContent = 'SET LIVE';
            }
        }

        // ===== SET LIVE =====
        async function handleSetLive() {
            if (!selectedSong || setLiveBtn.disabled) return;
            const title = getTitle(selectedSong);
            const bpmVal = getBpm(selectedSong);

            setLiveBtn.disabled = true;
            setLiveBtn.textContent = 'SENDING…';
            setLiveBtn.style.background = '#c8860f';
            setLiveBtn.style.color = '#000';
            setLiveBtn.style.cursor = 'wait';

            try {
                const { error } = await supabase.from('show_control').insert([{
                    song_id: String(selectedSong.id),
                    title: title,
                    bpm: bpmVal,
                    activated_at: new Date().toISOString()
                }]);

                if (error) {
                    if (error.message && error.message.includes('does not exist')) {
                        showToast('Run 00_setup.sql first — show_control table not found.', 'error');
                    } else {
                        showToast(`Error: ${error.message}`, 'error');
                    }
                } else {
                    liveSongId = String(selectedSong.id);
                    updateNowLive(title, bpmVal);
                    renderSongs();
                    updateBtnState();
                    showToast(`🎸 ${title} is now LIVE!`, 'success');
                }
            } catch (err) {
                showToast(`Error: ${err.message}`, 'error');
            }

            if (!liveSongId || String(liveSongId) !== String(selectedSong.id)) {
                setLiveBtn.style.background = '#f5a623';
                setLiveBtn.style.color = '#000';
                setLiveBtn.style.cursor = 'pointer';
                setLiveBtn.disabled = false;
            }
            updateBtnState();
        }
        setLiveBtn.addEventListener('click', handleSetLive);

        // Hover effects for the button
        setLiveBtn.addEventListener('mouseenter', () => {
            if (!setLiveBtn.disabled && setLiveBtn.style.background === '#f5a623') {
                setLiveBtn.style.background = '#f0a010';
                setLiveBtn.style.transform = 'translateY(-1px)';
                setLiveBtn.style.boxShadow = '0 4px 20px rgba(245,166,35,0.3)';
            }
        });
        setLiveBtn.addEventListener('mouseleave', () => {
            if (!setLiveBtn.disabled) {
                updateBtnState();
                setLiveBtn.style.transform = '';
                setLiveBtn.style.boxShadow = '';
            }
        });
        setLiveBtn.addEventListener('mousedown', () => {
            setLiveBtn.style.transform = 'translateY(0)';
        });

        // ===== NOW LIVE =====
        function updateNowLive(title, bpm) {
            if (title) {
                liveDot.style.color = '#22c55e';
                liveDot.classList.add('pulse-live');
                liveInfo.style.color = '#f0f0f0';
                liveInfo.textContent = title + (bpm != null ? ` — ${bpm} BPM` : '');
            } else {
                liveDot.style.color = '#2a2a2e';
                liveDot.classList.remove('pulse-live');
                liveInfo.style.color = '#3a3a40';
                liveInfo.textContent = 'Nothing active yet';
            }
        }

        // ===== REALTIME =====
        function subscribeRealtime() {
            if (realtimeChannel) {
                supabase.removeChannel(realtimeChannel);
            }
            try {
                realtimeChannel = supabase
                    .channel('show_control_live')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'show_control' }, (payload) => {
                        if (payload.new) {
                            liveSongId = String(payload.new.song_id);
                            updateNowLive(payload.new.title || '', payload.new.bpm);
                            renderSongs();
                            if (selectedSong) updateBtnState();
                        }
                    })
                    .subscribe();
            } catch (e) {
                // Realtime is optional
            }
        }

        // ===== FETCH SONGS =====
        async function fetchSongs() {
            try {
                const { data, error } = await supabase
                    .from('songs')
                    .select('*')
                    .order('setlist_order', { ascending: true, nullsFirst: false })
                    .order('id', { ascending: true });

                if (error) {
                    setConn('red', '● Error');
                    showToast('Error loading songs: ' + error.message, 'error');
                    songs = [];
                    renderSongs();
                    return;
                }

                if (data && data.length > 0) {
                    detectColumns(data[0]);
                    songs = data;
                } else {
                    songs = [];
                }

                setConn('green', '● Connected');
                renderSongs();

                // Restore selection
                if (selectedSong) {
                    const still = songs.find(s => String(s.id) === String(selectedSong.id));
                    if (still) {
                        selectedSong = still;
                        // Re-render detail without switching views
                        const title = getTitle(still);
                        const bpm = getBpm(still);
                        const key = getKey(still);
                        detailTitle.textContent = title;
                        if (bpm != null) {
                            bpmValue.textContent = bpm;
                            bpmValue.style.color = '#f5a623';
                        }
                        updateBtnState();
                    }
                }
            } catch (err) {
                setConn('red', '● Error');
                showToast('Connection failed: ' + err.message, 'error');
                songs = [];
                renderSongs();
            }
        }

        // ===== INIT =====
        async function initSupabase() {
            setConn('amber', '● Connecting…');
            try {
                supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
                await fetchSongs();
                subscribeRealtime();
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(fetchSongs, 30000);
            } catch (err) {
                setConn('red', '● Error');
                showToast('Failed to connect: ' + err.message, 'error');
            }
        }

        // ===== BOOT =====
        initSupabase();
    </script>
</body>
</html>
